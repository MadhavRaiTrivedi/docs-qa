name: docs-qa

x-backend: &backend
  build:
    context: backend
  environment: &backend-environment
    DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-docs_qa}:${POSTGRES_PASSWORD:-docs_qa}@postgres:5432/${POSTGRES_DB:-docs_qa}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs_qa}
      POSTGRES_USER: ${POSTGRES_USER:-docs_qa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docs_qa}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      OPENAI__API_KEY: ${OPENAI_API_KEY:-}
      OPENAI__MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      AUTH__API_KEYS: '{"${EDITOR_API_KEY:-dev-editor-key}": "EDITOR", "${READER_API_KEY:-dev-reader-key}": "READER"}'
    depends_on:
      migrator:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "docs_qa.worker"]
    environment:
      <<: *backend-environment
      OPENAI__API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    build:
      context: frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres-data:
